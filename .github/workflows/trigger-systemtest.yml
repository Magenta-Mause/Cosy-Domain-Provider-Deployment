name: Trigger Systemtests

# Pusht per SSH-Deploy-Key einen leeren Commit (auf Basis von main) auf den
# Branch `staging-deploy-trigger` im Systemtest-Repo — das startet dort die
# Staging-Smoke-Suite, die 5 Min auf den Argo-Sync wartet. Deploy-Keys können
# keine Workflows dispatchen, Pushes triggern sie aber.
# Secret SYSTEMTEST_DEPLOY_KEY = privater Teil des Write-Deploy-Keys auf
# Magenta-Mause/Cosy-Domain-Provider-Systemtest.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger-Commit ins Systemtest-Repo pushen
        env:
          DEPLOY_KEY: ${{ secrets.SYSTEMTEST_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:Magenta-Mause/Cosy-Domain-Provider-Systemtest.git systemtest
          cd systemtest
          git config user.name "cosy-deploy-trigger"
          git config user.email "deploy-trigger@users.noreply.github.com"
          git commit --allow-empty -m "deploy ${GITHUB_SHA::7}"
          git push --force origin HEAD:staging-deploy-trigger
