apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pushgateway
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Basic-Auth (Traefik), damit nur der Systemtest-CronJob pushen kann.
    # Referenziert die Middleware "pushgateway-auth" (siehe middleware.yaml);
    # Format: <namespace>-<middleware-name>@kubernetescrd. Das htpasswd-Secret
    # "pushgateway-basic-auth" (Key: users) muss manuell angelegt werden — siehe
    # docs/secrets-required.md.
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-pushgateway-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - pushgateway.jannekeipert.de
      secretName: pushgateway-tls
  rules:
    - host: pushgateway.jannekeipert.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pushgateway
                port:
                  number: 9091
