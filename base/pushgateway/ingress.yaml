apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pushgateway
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Basic-Auth, damit nur der Systemtest-CronJob pushen kann. Das Secret
    # "pushgateway-basic-auth" (htpasswd) muss manuell angelegt werden — siehe
    # docs/secrets-required.md.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: pushgateway-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Pushgateway - Authentication Required"
spec:
  tls:
    - hosts:
        - pushgateway.jannekeipert.de
      secretName: pushgateway-tls
  rules:
    - host: pushgateway.jannekeipert.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pushgateway
                port:
                  number: 9091
