apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  # WICHTIG: Der ServiceMonitor liegt bewusst in `default`, NICHT in `monitoring`.
  # Die Prometheus-Instanz/der Operator in Janne's Cluster greift nur SMs aus
  # `default` auf (dort liegen alle funktionierenden SMs: backend, mail-service,
  # covered). Der Pushgateway-Service in `monitoring` wird via
  # spec.namespaceSelector erreicht.
  namespace: default
  labels:
    # Muss zum serviceMonitorSelector der Prometheus-CR passen. In Janne's Cluster
    # selektiert default/prometheus-kube-prometheus-prometheus auf release=prometheus
    # (verifiziert via .spec.serviceMonitorSelector).
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: http
      interval: 30s
      # WICHTIG: honorLabels muss false sein. Gescraped wird inzwischen von Grafana Alloy
      # (Grafana Cloud), nicht mehr vom In-Cluster-Prometheus, und Alloys
      # OpenTelemetry-Pipeline verwirft jede Serie, deren job/instance nicht zum
      # Scrape-Target passt: mit honorLabels: true kamen job="cosy-systemtest" und ein
      # leeres instance="" durch, Alloy loggte bei jedem Scrape "Failed to scrape
      # Prometheus endpoint", und in Grafana Cloud stand up=0 bei null Systemtest-Serien.
      # Mit false bleiben alle Push-Labels erhalten, nur job/instance heißen dann
      # exported_job/exported_instance. In Grafana: job="monitoring/pushgateway",
      # exported_job="cosy-systemtest".
      honorLabels: false
