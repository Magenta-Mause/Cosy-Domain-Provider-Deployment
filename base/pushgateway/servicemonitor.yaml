apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    # Vom kube-prometheus-stack ueber dieses Label selektiert. Muss zum Helm-
    # Release-Namen passen — in Janne's Cluster `kube-prometheus-stack` (wie der
    # funktionierende Backend-SM cosy-domain-provider-backend-staging in ns monitoring).
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: http
      interval: 30s
      # WICHTIG: behält die im Push gesetzten Labels (job="cosy-systemtest", suite=...)
      # statt sie durch die Scrape-Target-Labels zu überschreiben.
      honorLabels: true
