apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  # WICHTIG: Der ServiceMonitor liegt bewusst in `default`, NICHT in `monitoring`.
  # Die Prometheus-Instanz/der Operator in Janne's Cluster greift nur SMs aus
  # `default` auf (dort liegen alle funktionierenden SMs: backend, mail-service,
  # covered). Der Pushgateway-Service in `monitoring` wird via
  # spec.namespaceSelector erreicht.
  namespace: default
  labels:
    # Muss zum serviceMonitorSelector der Prometheus-CR passen. In Janne's Cluster
    # selektiert default/prometheus-kube-prometheus-prometheus auf release=prometheus
    # (verifiziert via .spec.serviceMonitorSelector).
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: http
      interval: 30s
      # WICHTIG: behält die im Push gesetzten Labels (job="cosy-systemtest", suite=...)
      # statt sie durch die Scrape-Target-Labels zu überschreiben.
      honorLabels: true
