apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cosy-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
spec:
  tls:
    - hosts:
        - staging.domain-provider.cosy-hosting.net
      secretName: staging-tls
  rules:
    - host: staging.domain-provider.cosy-hosting.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
