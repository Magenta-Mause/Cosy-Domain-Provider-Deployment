apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cosy-staging
resources:
- ../../base
- ingress.yaml
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
        - name: STAGING_CAPTCHA_BYPASS_ENABLED
          value: "true"
  target:
    kind: Deployment
    name: backend
# Staging holds throwaway subdomains that point nowhere, so a nightly scan there
# would spend model tokens to produce a wall of UNREACHABLE. The CronJob is kept
# in the overlay (so manifest drift is still caught) but never fires on its own —
# `kubectl create job --from=cronjob/watchtower` for a manual smoke test.
- patch: |-
    - op: add
      path: /spec/suspend
      value: true
  target:
    kind: CronJob
    name: watchtower
images:
- name: ghcr.io/magenta-mause/cosy-domain-provider-backend
  newTag: main-7716a7c
- name: ghcr.io/magenta-mause/cosy-domain-provider-frontend
  newTag: staging-e251b1e
- name: ghcr.io/magenta-mause/cosy-domain-provider-watchtower
  newTag: staging-latest
