apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cosy-staging
resources:
- ../../base
- ingress.yaml
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
        - name: STAGING_CAPTCHA_BYPASS_ENABLED
          value: "true"
  target:
    kind: Deployment
    name: backend
images:
- name: ghcr.io/magenta-mause/cosy-domain-provider-backend
  newTag: main-6c72cde
- name: ghcr.io/magenta-mause/cosy-domain-provider-frontend
  newTag: staging-47a68bd
