apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cosy-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - domain-provider.cosy-hosting.net
      secretName: prod-tls
  rules:
    - host: domain-provider.cosy-hosting.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
