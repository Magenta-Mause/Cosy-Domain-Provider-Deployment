apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cosy-domain-provider-backend-prod
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - cosy-prod
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
