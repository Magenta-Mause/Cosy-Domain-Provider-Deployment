apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cosy-staging-monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: argocd
spec:
  project: cosy-domain-provider
  source:
    repoURL: https://github.com/Magenta-Mause/Cosy-Domain-Provider-Deployment
    targetRevision: main
    path: overlays/staging-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
