apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cosy-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/magenta-mause/cosy-domain-provider-deployment.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cosy-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
