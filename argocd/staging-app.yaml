apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cosy-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/magenta-mause/cosy-domain-provider-deployment.git
    targetRevision: main
    path: overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: cosy-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
